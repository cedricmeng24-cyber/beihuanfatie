<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>whity's desk</title>
<style>
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:#faf7ff; color:#3f3f46; line-height:1.7; }
  main { max-width:820px; margin:0 auto; padding:24px 18px 64px; }
  h1 { color:#5b3fa8; font-size:24px; margin:0 0 6px; }
  .sub { color:#a78bfa; font-size:13px; margin-bottom:20px; }
  .card { background:#fff; border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 8px 24px rgba(118,75,162,.08); }
  label { display:block; font-size:13px; color:#7c6fb0; margin:12px 0 6px; font-weight:600; }
  input[type=text], input[type=password], textarea, select {
    width:100%; padding:10px 12px; border:1px solid #ddd6fe; border-radius:10px;
    font:inherit; background:#fff; outline:none;
  }
  textarea { resize:vertical; }
  button { padding:9px 16px; border:none; border-radius:10px; background:#764ba2; color:#fff;
           font:inherit; cursor:pointer; transition:opacity .2s; }
  button.ghost, a.ghost { background:#f3ecff; color:#5b3fa8; }
  button.danger { background:#fde2e2; color:#c00; }
  button:hover { opacity:.9; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .list-item { display:flex; justify-content:space-between; align-items:center; padding:10px 4px;
               border-bottom:1px solid #f0eaff; font-size:14px; }
  .list-item .ttl { color:#5b3fa8; }
  .list-item .meta { color:#a78bfa; font-size:12px; }
  .img-row { display:grid; grid-template-columns:1fr auto; gap:6px; margin-bottom:6px; align-items:center; }
  .img-row input { padding:8px 10px; font-size:13px; }
  .status { color:#7c6fb0; font-size:13px; margin-top:10px; min-height:18px; }
  .status.err { color:#c00; }
  .gate { max-width:400px; margin:80px auto; text-align:center; }
  .gate pre { color:#764ba2; font-family:monospace; line-height:1.4; font-size:22px; }
</style>
</head>
<body>

<div id="gate" class="gate">
  <pre>
(\_/)
( •_•)
/ >  ✎</pre>
  <p style="color:#7c6fb0;font-size:14px;">输入 whity 的密码</p>
  <input id="gatePwd" type="password" placeholder="密码" style="max-width:200px;text-align:center;">
  <div class="row" style="justify-content:center;">
    <button onclick="checkGate()">进入</button>
  </div>
  <p id="gateMsg" style="color:#c00;font-size:13px;height:18px;"></p>
</div>

<main id="app" style="display:none;">
  <h1>🐇 whity's desk</h1>
  <p class="sub">写点东西存进抽屉。</p>

  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <strong style="color:#5b3fa8;">文章</strong>
      <button class="ghost" onclick="newArticle()">+ 新一篇</button>
    </div>
    <div id="list" style="margin-top:12px;">加载中...</div>
  </section>

  <section class="card" id="editor" style="display:none;">
    <strong id="editorTitle" style="color:#5b3fa8;">新文章</strong>

    <label>标题</label>
    <input id="fTitle" type="text" placeholder="标题">

    <label>正文</label>
    <textarea id="fText" rows="8" placeholder="正文..."></textarea>

    <label>图片</label>
    <div id="imgList"></div>
    <div class="row">
      <button class="ghost" onclick="addImgRow('')">+ 图片 URL</button>
      <label class="ghost" style="display:inline-block;padding:9px 16px;border-radius:10px;cursor:pointer;margin:0;">
        上传图片
        <input id="fileInput" type="file" accept="image/*" style="display:none;">
      </label>
    </div>
    <div id="uploadStatus" class="status"></div>

    <label>加密方式</label>
    <select id="fLock">
      <option value="none">不加密</option>
      <option value="locked">上锁</option>
      <option value="password">设置密码</option>
    </select>

    <div id="pwdBox" style="display:none;">
      <label>密码</label>
      <input id="fPwd" type="text" placeholder="设置密码">
    </div>

    <div class="row">
      <button onclick="saveArticle()">存进抽屉</button>
      <button class="ghost" onclick="closeEditor()">取消</button>
      <button class="danger" id="delBtn" style="display:none;" onclick="deleteArticle()">删除</button>
    </div>
    <div id="saveStatus" class="status"></div>
  </section>
</main>

<script>
const ADMIN_PWD = '0108';
const API_PWD = 'kano1224';
const WORKER_URL = 'https://empty-bird-fb8b.cedricmeng24.workers.dev';
const LOCKED_KEY = 'whity_locked_key_2026';

let articles = [];
let editingId = null;

function b64encode(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64decode(s) {
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function deriveKey(password, salt, usage) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, usage
  );
}
async function encryptText(text, password) {
  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt, ['encrypt']);
  const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(text));
  return { cipher: b64encode(new Uint8Array(cipher)), iv: b64encode(iv), salt: b64encode(salt) };
}
async function decryptText(cipherB64, password, ivB64, saltB64) {
  const key = await deriveKey(password, b64decode(saltB64), ['decrypt']);
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64decode(ivB64) }, key, b64decode(cipherB64)
  );
  return new TextDecoder().decode(plain);
}
async function hashPwd(password) {
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(password));
  return b64encode(new Uint8Array(hash));
}

function checkGate() {
  const v = document.getElementById('gatePwd').value.trim();
  if (v === ADMIN_PWD) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadList();
  } else {
    document.getElementById('gateMsg').textContent = '密码不正确';
    document.getElementById('gatePwd').value = '';
  }
}
document.getElementById('gatePwd').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkGate();
});

async function loadList() {
  const el = document.getElementById('list');
  el.textContent = '加载中...';
  try {
    const res = await fetch(`${WORKER_URL}/her-list?t=${Date.now()}`);
    const data = await res.json();
    articles = Array.isArray(data) ? data : [];
    if (!articles.length) { el.innerHTML = '<p style="color:#a78bfa;font-size:13px;">还没写过东西。</p>'; return; }
    el.innerHTML = '';
    articles.forEach(a => {
      const div = document.createElement('div');
      div.className = 'list-item';
      div.innerHTML = `
        <div>
          <div class="ttl">${a.title || '无标题'} ${a.lockType && a.lockType !== 'none' ? '🔒' : ''}</div>
          <div class="meta">${a.updatedAt || ''}</div>
        </div>
        <div style="display:flex;gap:6px;">
          <a class="ghost" href="whityswritings.html?id=${encodeURIComponent(a.id)}" target="_blank"
             style="padding:9px 16px;border-radius:10px;text-decoration:none;font-size:14px;">查看</a>
          <button class="ghost">编辑</button>
        </div>
      `;
      div.querySelector('button').onclick = () => editArticle(a.id);
      el.appendChild(div);
    });
  } catch (e) {
    el.innerHTML = '<p style="color:#c00;font-size:13px;">加载失败：' + e.message + '</p>';
  }
}

function newArticle() {
  editingId = null;
  document.getElementById('editorTitle').textContent = '新文章';
  document.getElementById('fTitle').value = '';
  document.getElementById('fText').value = '';
  document.getElementById('fLock').value = 'none';
  document.getElementById('fPwd').value = '';
  document.getElementById('pwdBox').style.display = 'none';
  document.getElementById('imgList').innerHTML = '';
  document.getElementById('delBtn').style.display = 'none';
  document.getElementById('saveStatus').textContent = '';
  document.getElementById('editor').style.display = 'block';
  window.scrollTo({ top: document.getElementById('editor').offsetTop, behavior: 'smooth' });
}

async function editArticle(id) {
  const a = articles.find(x => x.id === id);
  if (!a) return;
  editingId = id;
  document.getElementById('editorTitle').textContent = '编辑文章';
  document.getElementById('fTitle').value = a.title || '';
  document.getElementById('fLock').value = a.lockType || 'none';
  document.getElementById('fPwd').value = '';
  document.getElementById('pwdBox').style.display = a.lockType === 'password' ? 'block' : 'none';
  document.getElementById('imgList').innerHTML = '';
  (a.images || []).forEach(im => addImgRow(im.src || ''));
  document.getElementById('delBtn').style.display = 'inline-block';
  document.getElementById('saveStatus').textContent = '';

  const ta = document.getElementById('fText');
  if (a.lockType === 'none') {
    ta.value = a.text || '';
  } else if (a.lockType === 'locked') {
    try { ta.value = await decryptText(a.cipher, LOCKED_KEY, a.iv, a.salt); }
    catch { ta.value = ''; }
  } else {
    const pwd = prompt('这篇设了密码，输入密码才能编辑：');
    if (pwd === null) { ta.value = ''; return; }
    try { ta.value = await decryptText(a.cipher, pwd, a.iv, a.salt); }
    catch { alert('密码不对'); ta.value = ''; }
  }

  document.getElementById('editor').style.display = 'block';
  window.scrollTo({ top: document.getElementById('editor').offsetTop, behavior: 'smooth' });
}

function closeEditor() {
  document.getElementById('editor').style.display = 'none';
}

function addImgRow(src) {
  const row = document.createElement('div');
  row.className = 'img-row';
  const s = document.createElement('input');
  s.type = 'text';
  s.placeholder = '图片地址';
  s.value = src;
  s.className = 'img-src';
  const d = document.createElement('button');
  d.type = 'button';
  d.className = 'danger';
  d.textContent = '×';
  d.onclick = () => row.remove();
  row.append(s, d);
  document.getElementById('imgList').appendChild(row);
}

document.getElementById('fileInput').addEventListener('change', async () => {
  const file = document.getElementById('fileInput').files[0];
  if (!file) return;
  const st = document.getElementById('uploadStatus');
  st.textContent = '上传中...'; st.className = 'status';
  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    let bin = ''; const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk)
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    const res = await fetch(`${WORKER_URL}/her-upload`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ adminPassword: API_PWD, filename: file.name, content: btoa(bin) })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '失败');
    addImgRow(data.path);
    st.textContent = '已上传';
  } catch (e) {
    st.textContent = '失败：' + e.message; st.className = 'status err';
  } finally {
    document.getElementById('fileInput').value = '';
  }
});

async function saveArticle() {
  const st = document.getElementById('saveStatus');
  const title = document.getElementById('fTitle').value.trim();
  const text = document.getElementById('fText').value.trim();
  const lockType = document.getElementById('fLock').value;
  const userPwd = document.getElementById('fPwd').value.trim();

  const images = [];
  document.querySelectorAll('#imgList .img-row').forEach(row => {
    const src = row.querySelector('.img-src').value.trim();
    if (src) images.push({ src, alt: '' });
  });

  if (!title && !text && !images.length) {
    st.textContent = '居然选择什么都不写嘛！'; st.className = 'status err'; return;
  }

  st.textContent = '保存中...'; st.className = 'status';

  try {
    const payload = {
      adminPassword: API_PWD,
      id: editingId,
      title,
      images,
      lockType,
      _plain: text,
      _pwd: ''
    };

    if (lockType === 'none') {
      payload.text = text;
      payload.cipher = '';
      payload.iv = '';
      payload.salt = '';
      payload.pwdHash = '';
    } else {
      const realPwd = lockType === 'locked' ? LOCKED_KEY : (userPwd || 'loveyou');
      const enc = await encryptText(text, realPwd);
      payload.text = '';
      payload.cipher = enc.cipher;
      payload.iv = enc.iv;
      payload.salt = enc.salt;
      payload.pwdHash = await hashPwd(realPwd);
      payload._pwd = lockType === 'locked' ? '【自动上锁】' : (userPwd || 'loveyou');
    }

    const res = await fetch(`${WORKER_URL}/her-save`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '失败');

    st.textContent = '已存进抽屉 ✒';
    setTimeout(() => { closeEditor(); loadList(); }, 1200);
  } catch (e) {
    st.textContent = '失败：' + e.message; st.className = 'status err';
  }
}

async function deleteArticle() {
  if (!editingId) return;
  if (!confirm('确定删除这一篇吗？')) return;
  const st = document.getElementById('saveStatus');
  st.textContent = '删除中...'; st.className = 'status';
  try {
    const res = await fetch(`${WORKER_URL}/her-delete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: editingId, adminPassword: API_PWD })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '失败');
    st.textContent = '已删除';
    setTimeout(() => { closeEditor(); loadList(); }, 800);
  } catch (e) {
    st.textContent = '失败：' + e.message; st.className = 'status err';
  }
}

document.getElementById('fLock').addEventListener('change', (e) => {
  document.getElementById('pwdBox').style.display = e.target.value === 'password' ? 'block' : 'none';
});
</script>
</body>
</html>
