<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内容后台</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #111827;
      line-height: 1.6;
    }

    main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }

    h1 { font-size: 28px; margin: 0 0 20px; }
    h2 { font-size: 20px; margin: 0 0 12px; }
    h3 { font-size: 16px; margin: 20px 0 8px; }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
    }

    label { display: block; margin: 12px 0 6px; font-weight: 600; }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font: inherit;
      background: #fff;
    }

    textarea { resize: vertical; }

    button {
      margin-top: 14px;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    button:hover { opacity: .92; }
    button.danger { background: #dc2626; margin-top: 0; }

    .image-row {
      display: grid;
      grid-template-columns: 2fr 1fr auto;
      gap: 8px;
      margin: 8px 0;
      align-items: center;
    }

    .status {
      margin: 10px 0 0;
      color: #4b5563;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .status.error { color: #b91c1c; }
    .hint { color: #6b7280; font-size: 13px; line-height: 1.6; }

    .log-item {
      padding: 12px 14px;
      margin-bottom: 8px;
      background: #f9fafb;
      border-radius: 10px;
      font-size: 14px;
      border-left: 3px solid #111827;
      word-break: break-all;
    }

    .log-item .log-time { font-weight: 700; color: #111827; }
    .log-item .log-meta { color: #6b7280; font-size: 13px; margin-top: 4px; }

    #errorBanner {
      display: none;
      margin-bottom: 16px;
      padding: 14px 16px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      border-radius: 12px;
      font-size: 14px;
      white-space: pre-wrap;
    }

    @media (max-width: 720px) {
      .image-row { grid-template-columns: 1fr; }
      button.danger { width: 100%; }
    }
  </style>
</head>
<body>
<main>
  <div id="errorBanner"></div>
  <h1>内容后台</h1>

  <section class="card">
    <h2>GitHub 连接</h2>
    <p class="hint">
      使用 Fine-grained Personal Access Token。权限只需要该仓库的
      Contents: Read and write；Metadata: Read-only。
    </p>

    <label for="owner">用户名或组织</label>
    <input id="owner" type="text" placeholder="例如 octocat">

    <label for="repo">仓库名</label>
    <input id="repo" type="text" placeholder="例如 my-qr-site">

    <label for="branch">分支</label>
    <input id="branch" type="text" value="main">

    <label for="token">Token</label>
    <input id="token" type="password" placeholder="github_pat_...">

    <label>
      <input id="remember" type="checkbox">
      记住连接信息，Token 会存到 localStorage。只在自己的设备上勾选。
    </label>

    <button id="connect">连接并读取内容</button>
    <p id="connStatus" class="status"></p>
  </section>

  <section class="card">
    <h2>Worker 诊断</h2>
    <p class="hint">
      检查 Cloudflare Worker 是否正常。正常会返回 HTTP 200 和 JSON（新站点是 []）。
    </p>
    <button id="pingWorker">检查 Worker 状态</button>
    <p id="pingStatus" class="status"></p>
  </section>

  <section class="card">
    <h2>评论管理</h2>
    <p class="hint">
      查看和删除访客留言。删除需要下面的日志密码。
    </p>
    <button id="loadCommentsBtn">加载评论</button>
    <p id="commentAdminStatus" class="status"></p>
    <div id="commentAdminList" style="margin-top:16px;"></div>
  </section>

  <section class="card">
    <h2>访问记录</h2>
    <p class="hint">
      每次有人打开公开页，就会记录一条。包括时间、IP、国家地区、浏览器。
    </p>

    <label for="logsPwd">日志密码</label>
    <input id="logsPwd" type="password" placeholder="你在 Worker 里设置的 LOGS_PASSWORD">

    <button id="loadLogs">加载访问记录</button>
    <button id="clearLogs" class="danger" style="margin-left:8px;">清空记录</button>
    <p id="logStatus" class="status"></p>
    <div id="logList" style="margin-top:16px;"></div>
  </section>

  <section class="card">
    <h2>页面内容</h2>

    <label for="title">标题</label>
    <input id="title" type="text">

    <label for="text">正文</label>
    <textarea id="text" rows="8"></textarea>

    <h3>图片</h3>
    <div id="imageList"></div>
    <button id="addImage" type="button">添加图片 URL</button>

    <h3>上传图片</h3>
    <input id="fileInput" type="file" accept="image/*">
    <p id="uploadStatus" class="status"></p>

    <button id="save">保存到 GitHub</button>
    <p id="saveStatus" class="status"></p>
  </section>
</main>

<script>
(function () {
  'use strict';

  var WORKER_URL = 'https://empty-bird-fb8b.cedricmeng24.workers.dev';

  function $(id) { return document.getElementById(id); }

  var errorBanner = $('errorBanner');

  function showFatal(msg) {
    if (!errorBanner) return;
    errorBanner.textContent = '脚本错误：' + msg;
    errorBanner.style.display = 'block';
  }

  window.addEventListener('error', function (e) {
    showFatal(e.message || '未知错误');
  });

  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    showFatal((r && r.message) ? r.message : String(r));
  });

  function need(id) {
    var el = $(id);
    if (!el) throw new Error('页面缺少元素 #' + id + '，HTML 与 JS 版本不一致');
    return el;
  }

  function setStatus(el, message, isError) {
    if (!el) return;
    el.textContent = message;
    el.className = 'status' + (isError ? ' error' : '');
  }

  function fetchWithTimeout(url, options, ms) {
    var opts = options || {};
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, ms || 20000);
    opts.signal = ctrl.signal;

    return fetch(url, opts).then(function (res) {
      clearTimeout(timer);
      return res;
    }, function (err) {
      clearTimeout(timer);
      if (err && err.name === 'AbortError') {
        throw new Error('请求超时，对方没有响应');
      }
      throw err;
    });
  }

  try {
    boot();
  } catch (err) {
    showFatal((err && err.message) ? err.message : String(err));
  }

  function boot() {
    var ownerEl = need('owner');
    var repoEl = need('repo');
    var branchEl = need('branch');
    var tokenEl = need('token');
    var rememberEl = need('remember');
    var connectBtn = need('connect');
    var connStatus = need('connStatus');

    var titleEl = need('title');
    var textEl = need('text');
    var imageListEl = need('imageList');
    var addImageBtn = need('addImage');
    var fileInput = need('fileInput');
    var uploadStatus = need('uploadStatus');
    var saveBtn = need('save');
    var saveStatus = need('saveStatus');

    var pingBtn = need('pingWorker');
    var pingStatusEl = need('pingStatus');

    var loadCommentsBtn = need('loadCommentsBtn');
    var commentAdminStatusEl = need('commentAdminStatus');
    var commentAdminListEl = need('commentAdminList');

    var logsPwdEl = need('logsPwd');
    var loadLogsBtn = need('loadLogs');
    var clearLogsBtn = need('clearLogs');
    var logStatusEl = need('logStatus');
    var logListEl = need('logList');

    var owner = '';
    var repo = '';
    var branch = 'main';
    var token = '';
    var currentSha = null;

    /* ---------- GitHub 基础 ---------- */

    function readConfig() {
      owner = ownerEl.value.trim();
      repo = repoEl.value.trim();
      branch = branchEl.value.trim() || 'main';
      token = tokenEl.value.trim();
    }

    function apiUrl(path) {
      var safePath = String(path).split('/').map(encodeURIComponent).join('/');
      return 'https://api.github.com/repos/' +
        encodeURIComponent(owner) + '/' +
        encodeURIComponent(repo) + '/contents/' + safePath;
    }

    function ghHeaders() {
      return {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + token,
        'X-GitHub-Api-Version': '2022-11-28'
      };
    }

    function getErrorMessage(res) {
      return res.text().then(function (text) {
        try {
          var data = JSON.parse(text);
          return data.message || text;
        } catch (e) {
          return text;
        }
      });
    }

    function encodeBase64Unicode(str) {
      var bytes = new TextEncoder().encode(str);
      var binary = '';
      var chunk = 0x8000;
      for (var i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    function decodeBase64Unicode(base64) {
      var clean = base64.replace(/\s/g, '');
      var binary = atob(clean);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }

    function arrayBufferToBase64(buffer) {
      var bytes = new Uint8Array(buffer);
      var binary = '';
      var chunk = 0x8000;
      for (var i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    function getFile(path) {
      return fetchWithTimeout(
        apiUrl(path) + '?ref=' + encodeURIComponent(branch),
        { headers: ghHeaders() },
        20000
      ).then(function (res) {
        if (res.status === 404) return null;
        if (!res.ok) {
          return getErrorMessage(res).then(function (m) { throw new Error(m); });
        }
        return res.json().then(function (data) {
          return { sha: data.sha, text: decodeBase64Unicode(data.content || '') };
        });
      });
    }

    function putTextFile(path, text, message, sha) {
      var body = {
        message: message,
        content: encodeBase64Unicode(text),
        branch: branch
      };
      if (sha) body.sha = sha;

      return fetchWithTimeout(apiUrl(path), {
        method: 'PUT',
        headers: {
          'Accept': 'application/vnd.github+json',
          'Authorization': 'Bearer ' + token,
          'X-GitHub-Api-Version': '2022-11-28',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      }, 30000).then(function (res) {
        if (!res.ok) {
          return getErrorMessage(res).then(function (m) { throw new Error(m); });
        }
        return res.json();
      });
    }

    function uploadImage(file) {
      var safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_') || 'image';
      var path = 'images/' + Date.now() + '-' +
        Math.random().toString(36).slice(2, 8) + '-' + safeName;

      return file.arrayBuffer().then(function (buf) {
        return fetchWithTimeout(apiUrl(path), {
          method: 'PUT',
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': 'Bearer ' + token,
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Upload ' + path,
            content: arrayBufferToBase64(buf),
            branch: branch
          })
        }, 60000);
      }).then(function (res) {
        if (!res.ok) {
          return getErrorMessage(res).then(function (m) { throw new Error(m); });
        }
        return path;
      });
    }

    /* ---------- 表单 ---------- */

    function addImageRow(src, alt) {
      var row = document.createElement('div');
      row.className = 'image-row';

      var srcInput = document.createElement('input');
      srcInput.type = 'text';
      srcInput.className = 'img-src';
      srcInput.placeholder = '图片地址，例如 images/abc.jpg 或 https://...';
      srcInput.value = src || '';

      var altInput = document.createElement('input');
      altInput.type = 'text';
      altInput.className = 'img-alt';
      altInput.placeholder = '图片说明，可空';
      altInput.value = alt || '';

      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'danger';
      removeBtn.textContent = '删除';
      removeBtn.addEventListener('click', function () { row.remove(); });

      row.append(srcInput, altInput, removeBtn);
      imageListEl.appendChild(row);
    }

    function fillForm(data) {
      titleEl.value = data.title || '';
      textEl.value = data.text || '';
      imageListEl.innerHTML = '';
      var images = Array.isArray(data.images) ? data.images : [];
      images.forEach(function (item) {
        if (!item) return;
        addImageRow(item.src || '', item.alt || '');
      });
    }

    function collectContent() {
      var images = [];
      var rows = imageListEl.querySelectorAll('.image-row');
      Array.prototype.forEach.call(rows, function (row) {
        var src = row.querySelector('.img-src').value.trim();
        var alt = row.querySelector('.img-alt').value.trim();
        if (src) images.push({ src: src, alt: alt });
      });

      return {
        title: titleEl.value.trim(),
        text: textEl.value,
        images: images,
        updatedAt: new Date().toLocaleString('zh-CN', { hour12: false })
      };
    }

    /* ---------- 恢复本地配置 ---------- */

    (function initSavedConfig() {
      var raw = null;
      try { raw = localStorage.getItem('github-admin-config'); } catch (e) { return; }
      if (!raw) return;

      try {
        var cfg = JSON.parse(raw);
        ownerEl.value = cfg.owner || '';
        repoEl.value = cfg.repo || '';
        branchEl.value = cfg.branch || 'main';
        tokenEl.value = cfg.token || '';
        rememberEl.checked = true;
      } catch (e) { /* 忽略坏数据 */ }
    })();

    /* ---------- 连接 GitHub ---------- */

    connectBtn.addEventListener('click', function () {
      readConfig();

      if (!owner || !repo || !token) {
        setStatus(connStatus, '请填写 owner、repo 和 token。', true);
        return;
      }

      try {
        if (rememberEl.checked) {
          localStorage.setItem('github-admin-config', JSON.stringify({
            owner: owner, repo: repo, branch: branch, token: token
          }));
        } else {
          localStorage.removeItem('github-admin-config');
        }
      } catch (e) { /* 隐私模式下可能失败，不影响使用 */ }

      setStatus(connStatus, '正在读取 content.json...');

      getFile('content.json').then(function (file) {
        if (file) {
          var data;
          try {
            data = JSON.parse(file.text);
          } catch (e) {
            throw new Error('content.json 不是合法 JSON，请先修好仓库里的这个文件');
          }
          currentSha = file.sha;
          fillForm(data);
          setStatus(connStatus, '读取成功。');
        } else {
          currentSha = null;
          fillForm({ title: '扫码查看', text: '', images: [], updatedAt: '' });
          setStatus(connStatus, 'content.json 不存在，点击保存会创建。');
        }
      }).catch(function (err) {
        setStatus(connStatus, '连接失败：' + err.message, true);
      });
    });

    /* ---------- 图片 ---------- */

    addImageBtn.addEventListener('click', function () { addImageRow('', ''); });

    fileInput.addEventListener('change', function () {
      var file = fileInput.files[0];
      if (!file) return;

      readConfig();

      if (!owner || !repo || !token) {
        setStatus(uploadStatus, '请先填写连接信息并连接。', true);
        fileInput.value = '';
        return;
      }

      setStatus(uploadStatus, '正在上传图片...');

      uploadImage(file).then(function (path) {
        addImageRow(path, file.name);
        setStatus(uploadStatus, '图片已上传到仓库。点击“保存到 GitHub”保存内容。');
      }).catch(function (err) {
        setStatus(uploadStatus, '上传失败：' + err.message, true);
      }).then(function () {
        fileInput.value = '';
      });
    });

    /* ---------- 保存内容 ---------- */

    saveBtn.addEventListener('click', function () {
      readConfig();

      if (!owner || !repo || !token) {
        setStatus(saveStatus, '请先填写连接信息并连接。', true);
        return;
      }

      setStatus(saveStatus, '正在保存...');

      var content = collectContent();
      var text = JSON.stringify(content, null, 2);

      putTextFile('content.json', text, 'Update content.json', currentSha)
        .then(function (result) {
          currentSha = (result.content && result.content.sha) || currentSha;
          setStatus(saveStatus, '保存成功。GitHub Pages 需要几十秒到几分钟部署。');
        })
        .catch(function (err) {
          setStatus(saveStatus, '保存失败：' + err.message, true);
        });
    });

    /* ---------- Worker 诊断 ---------- */

    pingBtn.addEventListener('click', function () {
      var url = WORKER_URL + '/comments';
      setStatus(pingStatusEl, '正在请求 ' + url);

      fetchWithTimeout(url, {}, 15000).then(function (res) {
        return res.text().then(function (body) {
          setStatus(
            pingStatusEl,
            'HTTP ' + res.status + ' ' + res.statusText + '\n' + body.slice(0, 300),
            !res.ok
          );
        });
      }).catch(function (err) {
        setStatus(pingStatusEl, '请求失败：' + err.message, true);
      });
    });

    /* ---------- 评论管理 ---------- */

    function renderAdminComment(c) {
      var div = document.createElement('div');
      div.className = 'log-item';

      var head = document.createElement('div');
      head.className = 'log-time';
      head.textContent = (c.name || '匿名访客') + ' · ' + (c.localTime || '');

      var text = document.createElement('div');
      text.className = 'log-meta';
      text.style.color = '#111827';
      text.style.fontSize = '14px';
      text.style.marginTop = '6px';
      text.textContent = c.text || '';

      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'danger';
      delBtn.style.marginTop = '8px';
      delBtn.textContent = '删除';

      delBtn.addEventListener('click', function () {
        var pwd = logsPwdEl.value.trim();

        if (!pwd) {
          alert('请先在“访问记录”里填写日志密码。');
          return;
        }

        if (!confirm('确定删除这条评论？')) return;

        fetchWithTimeout(
          WORKER_URL + '/comment/delete?pwd=' + encodeURIComponent(pwd),
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: c.id })
          },
          15000
        ).then(function (res) {
          if (res.status === 401) { alert('密码错误。'); return; }
          if (!res.ok) { alert('删除失败：HTTP ' + res.status); return; }
          div.remove();
        }).catch(function (err) {
          alert('删除失败：' + err.message);
        });
      });

      div.append(head, text, delBtn);
      return div;
    }

    loadCommentsBtn.addEventListener('click', function () {
      setStatus(commentAdminStatusEl, '正在加载...');
      commentAdminListEl.innerHTML = '';

      fetchWithTimeout(WORKER_URL + '/comments?_=' + Date.now(), {}, 15000)
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function (comments) {
          if (!comments.length) {
            setStatus(commentAdminStatusEl, '还没有评论。');
            return;
          }
          comments.forEach(function (c) {
            commentAdminListEl.appendChild(renderAdminComment(c));
          });
          setStatus(commentAdminStatusEl, '共 ' + comments.length + ' 条评论。');
        })
        .catch(function (err) {
          setStatus(commentAdminStatusEl, '加载失败：' + err.message, true);
        });
    });

    /* ---------- 访问记录 ---------- */

    function formatLogItem(item) {
      var div = document.createElement('div');
      div.className = 'log-item';

      var time = document.createElement('div');
      time.className = 'log-time';
      time.textContent = item.localTime || item.time || '';

      var meta = document.createElement('div');
      meta.className = 'log-meta';

      var parts = [];
      if (item.country) parts.push(item.country);
      if (item.region) parts.push(item.region);
      if (item.city) parts.push(item.city);
      if (item.ip) parts.push('IP: ' + item.ip);
      if (item.screenSize) parts.push('屏幕: ' + item.screenSize);
      if (item.language) parts.push('语言: ' + item.language);
      if (item.referer) parts.push('来源: ' + item.referer);

      meta.textContent = parts.join(' · ');

      var ua = document.createElement('div');
      ua.className = 'log-meta';
      ua.textContent = item.ua || '';

      div.append(time, meta, ua);
      return div;
    }

    loadLogsBtn.addEventListener('click', function () {
      var pwd = logsPwdEl.value.trim();

      if (!pwd) {
        setStatus(logStatusEl, '请先填写日志密码。', true);
        return;
      }

      setStatus(logStatusEl, '正在加载...');
      logListEl.innerHTML = '';

      fetchWithTimeout(
        WORKER_URL + '/logs?pwd=' + encodeURIComponent(pwd) + '&_=' + Date.now(),
        {},
        15000
      ).then(function (res) {
        if (res.status === 401) throw new Error('AUTH');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }).then(function (logs) {
        if (!logs.length) {
          setStatus(logStatusEl, '目前还没有访问记录。');
          return;
        }
        logs.forEach(function (item) {
          logListEl.appendChild(formatLogItem(item));
        });
        setStatus(logStatusEl, '共 ' + logs.length + ' 条记录。');
      }).catch(function (err) {
        if (err.message === 'AUTH') {
          setStatus(logStatusEl, '密码错误。', true);
        } else {
          setStatus(logStatusEl, '加载失败：' + err.message, true);
        }
      });
    });

    clearLogsBtn.addEventListener('click', function () {
      var pwd = logsPwdEl.value.trim();

      if (!pwd) {
        setStatus(logStatusEl, '请先填写日志密码。', true);
        return;
      }

      if (!confirm('确定要清空所有访问记录吗？此操作不可恢复。')) return;

      fetchWithTimeout(
        WORKER_URL + '/clear?pwd=' + encodeURIComponent(pwd),
        { method: 'POST' },
        15000
      ).then(function (res) {
        if (res.status === 401) throw new Error('AUTH');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        logListEl.innerHTML = '';
        setStatus(logStatusEl, '已清空。');
      }).catch(function (err) {
        if (err.message === 'AUTH') {
          setStatus(logStatusEl, '密码错误。', true);
        } else {
          setStatus(logStatusEl, '清空失败：' + err.message, true);
        }
      });
    });
  }
})();
</script>
</body>
</html>
