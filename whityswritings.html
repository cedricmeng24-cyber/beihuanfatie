<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>whity's writings</title>
<style>
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:#faf7ff; color:#3f3f46; line-height:1.8; }
  main { max-width:860px; margin:0 auto; padding:32px 18px 64px; }
  h1 { color:#5b3fa8; font-size:clamp(24px,5vw,34px); margin:0 0 8px; }
  .date { color:#a78bfa; font-size:13px; margin-bottom:24px; }
  .text { white-space:pre-wrap; font-size:17px; margin-bottom:24px; }
  .images { display:grid; gap:16px; }
  figure { margin:0; background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 8px 24px rgba(118,75,162,.08); }
  img { display:block; width:100%; height:auto; }
  .lock { background:#f3ecff; border-left:4px solid #764ba2; border-radius:12px; padding:20px; color:#5b3fa8; }
  .back { display:inline-block; margin-bottom:24px; color:#764ba2; text-decoration:none; font-size:14px; }
  input[type=password] { padding:10px 12px; border:1px solid #ddd6fe; border-radius:10px; outline:none; font:inherit; }
  button { padding:10px 16px; border:none; border-radius:10px; background:#764ba2; color:#fff; font:inherit; cursor:pointer; }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">← 返回</a>
  <h1 id="title">加载中...</h1>
  <div class="date" id="date"></div>
  <div id="body"></div>
</main>

<script>
const LOCKED_KEY = 'whity_locked_key_2026';
const params = new URLSearchParams(location.search);
const id = params.get('id');

function b64decode(s) {
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
  );
}

async function decryptText(cipherB64, password, ivB64, saltB64) {
  const key = await deriveKey(password, b64decode(saltB64));
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64decode(ivB64) },
    key,
    b64decode(cipherB64)
  );
  return new TextDecoder().decode(plain);
}

async function load() {
  if (!id) { document.getElementById('body').innerHTML = '<p>缺少文章 ID</p>'; return; }
  try {
    const res = await fetch(`./her_article.json?v=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const list = Array.isArray(data) ? data : [data];
    const item = list.find(x => x.id === id);
    if (!item) { document.getElementById('body').innerHTML = '<p>找不到这篇文章</p>'; return; }

    document.getElementById('title').textContent = item.title || '无标题';
    document.getElementById('date').textContent = item.updatedAt || '';

    const bodyEl = document.getElementById('body');
    bodyEl.innerHTML = '';

    function renderAll(plainText) {
      bodyEl.innerHTML = '';
      const textEl = document.createElement('div');
      textEl.className = 'text';
      textEl.textContent = plainText || '';
      bodyEl.appendChild(textEl);

      if (Array.isArray(item.images) && item.images.length) {
        const imgs = document.createElement('div');
        imgs.className = 'images';
        item.images.forEach(im => {
          if (!im || !im.src) return;
          const fig = document.createElement('figure');
          const img = document.createElement('img');
          img.src = im.src; img.alt = ''; img.loading = 'lazy';
          fig.appendChild(img);
          imgs.appendChild(fig);
        });
        bodyEl.appendChild(imgs);
      }
    }

    if (item.lockType === 'none') {
      renderAll(item.text || '');
    } else if (item.lockType === 'locked') {
      bodyEl.innerHTML = `
        <div class="lock">
          🔒 这篇文章被锁起来了。
          <div style="margin-top:12px;"><button id="unlockBtn">解锁</button></div>
        </div>
      `;
      document.getElementById('unlockBtn').onclick = async () => {
        try {
          const plain = await decryptText(item.cipher, LOCKED_KEY, item.iv, item.salt);
          renderAll(plain);
        } catch {
          bodyEl.innerHTML = '<p style="color:#c00;">解锁失败，可能数据损坏。</p>';
        }
      };
    } else if (item.lockType === 'password') {
      bodyEl.innerHTML = `
        <div style="display:flex;gap:8px;align-items:center;margin-top:12px;">
          <input type="password" id="pw" placeholder="输入密码查看...">
          <button id="pwBtn">查看</button>
        </div>
        <p id="pwMsg" style="color:#c00;font-size:13px;height:18px;"></p>
      `;
      document.getElementById('pwBtn').onclick = async () => {
        const v = document.getElementById('pw').value;
        try {
          const plain = await decryptText(item.cipher, v, item.iv, item.salt);
          renderAll(plain);
        } catch {
          document.getElementById('pwMsg').textContent = '密码不正确';
        }
      };
    }
  } catch (e) {
    document.getElementById('body').innerHTML = '<p>加载失败：' + e.message + '</p>';
  }
}
load();
</script>
</body>
</html>
