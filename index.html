<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>扫码查看</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #111827;
      line-height: 1.7;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 18px 64px;
    }

    h1 {
      font-size: clamp(28px, 6vw, 44px);
      line-height: 1.2;
      margin: 0 0 24px;
      word-break: break-word;
    }

    .text {
      white-space: pre-wrap;
      font-size: 18px;
      margin: 0 0 28px;
    }

    .images {
      display: grid;
      gap: 18px;
    }

    figure {
      margin: 0;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    figcaption {
      padding: 10px 14px;
      color: #6b7280;
      font-size: 14px;
    }

    .updated {
      margin-top: 32px;
      color: #9ca3af;
      font-size: 13px;
    }

    .error {
      padding: 16px;
      background: #fef2f2;
      color: #991b1b;
      border-radius: 12px;
    }
        .comments {
      margin-top: 48px;
      padding-top: 28px;
      border-top: 1px solid #e5e7eb;
    }

    .comments h2 {
      font-size: 22px;
      margin: 0 0 16px;
    }

    #commentForm {
      display: grid;
      gap: 10px;
      margin-bottom: 24px;
    }

    #commentForm input,
    #commentForm textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font: inherit;
      background: #fff;
      resize: vertical;
    }

    .comment-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .comment-actions button {
      padding: 8px 20px;
      border: 0;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    .comment-actions button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #commentStatus {
      color: #6b7280;
      font-size: 13px;
    }

    .comment-item {
      background: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    .comment-head {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .comment-name {
      font-weight: 600;
      color: #111827;
    }

    .comment-text {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 15px;
    }

    .comment-empty {
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>
<body>
<main>
  <h1 id="title">加载中...</h1>
  <div id="text" class="text"></div>
  <div id="images" class="images"></div>
  <div id="updated" class="updated"></div>
  <section class="comments">
    <h2>留言</h2>
    <form id="commentForm">
      <input id="commentName" type="text" maxlength="20" placeholder="昵称（可不填）">
      <textarea id="commentText" maxlength="500" rows="3" placeholder="说点什么..." required></textarea>
      <div class="comment-actions">
        <button type="submit" id="commentSubmit">发送</button>
        <span id="commentStatus"></span>
      </div>
    </form>
    <div id="commentList" class="comment-list">正在加载留言...</div>
  </section>
</main>

<script>
async function loadContent() {
  const titleEl = document.getElementById('title');
  const textEl = document.getElementById('text');
  const imagesEl = document.getElementById('images');
  const updatedEl = document.getElementById('updated');

  try {
    const res = await fetch(`./content.json?v=${Date.now()}`, {
      cache: 'no-store'
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();

    titleEl.textContent = data.title || '';
    textEl.textContent = data.text || '';

    imagesEl.innerHTML = '';

    (data.images || []).forEach(item => {
      if (!item || !item.src) return;

      const figure = document.createElement('figure');
      const img = document.createElement('img');

      img.src = item.src;
      img.alt = item.alt || '';
      img.loading = 'lazy';

      figure.appendChild(img);

      if (item.alt) {
        const cap = document.createElement('figcaption');
        cap.textContent = item.alt;
        figure.appendChild(cap);
      }

      imagesEl.appendChild(figure);
    });

    updatedEl.textContent = data.updatedAt
      ? `更新时间：${data.updatedAt}`
      : '';
  } catch (err) {
    titleEl.textContent = '加载失败';
    textEl.innerHTML = '';
    imagesEl.innerHTML = '';

    const div = document.createElement('div');
    div.className = 'error';
    div.textContent = '无法读取 content.json。请确认文件已提交，并等待 GitHub Pages 部署完成。';

    imagesEl.appendChild(div);
    console.error(err);
  }
}

loadContent();
/* ========== 评论 ========== */
const WORKER_URL = 'https://visit-logger.你的用户名.workers.dev';

const commentListEl = document.getElementById('commentList');
const commentFormEl = document.getElementById('commentForm');
const commentNameEl = document.getElementById('commentName');
const commentTextEl = document.getElementById('commentText');
const commentSubmitEl = document.getElementById('commentSubmit');
const commentStatusEl = document.getElementById('commentStatus');

function renderComment(c) {
  const div = document.createElement('div');
  div.className = 'comment-item';

  const head = document.createElement('div');
  head.className = 'comment-head';

  const name = document.createElement('span');
  name.className = 'comment-name';
  name.textContent = c.name || '匿名访客';

  const time = document.createElement('span');
  time.textContent = c.localTime || '';

  head.append(name, time);

  const text = document.createElement('div');
  text.className = 'comment-text';
  text.textContent = c.text || '';

  div.append(head, text);
  return div;
}

async function loadComments() {
  try {
    const res = await fetch(`${WORKER_URL}/comments?_=${Date.now()}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const comments = await res.json();
    commentListEl.innerHTML = '';

    if (!comments.length) {
      commentListEl.innerHTML = '<p class="comment-empty">还没有留言，来抢沙发吧。</p>';
      return;
    }

    comments.forEach(c => commentListEl.appendChild(renderComment(c)));
  } catch (e) {
    commentListEl.innerHTML = '<p class="comment-empty">留言加载失败。</p>';
  }
}

commentFormEl.addEventListener('submit', async (e) => {
  e.preventDefault();

  const text = commentTextEl.value.trim();
  if (!text) return;

  commentSubmitEl.disabled = true;
  commentStatusEl.textContent = '发送中...';

  try {
    const res = await fetch(`${WORKER_URL}/comment`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: commentNameEl.value.trim(),
        text
      })
    });

    if (res.status === 429) {
      commentStatusEl.textContent = '发送太频繁，稍后再试。';
      return;
    }

    if (!res.ok) {
      commentStatusEl.textContent = '发送失败。';
      return;
    }

    commentTextEl.value = '';
    commentStatusEl.textContent = '已发送。';
    await loadComments();
  } catch (err) {
    commentStatusEl.textContent = '发送失败：' + err.message;
  } finally {
    commentSubmitEl.disabled = false;
    setTimeout(() => { commentStatusEl.textContent = ''; }, 3000);
  }
});

loadComments();
</script>
</body>
</html>
